<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            background-color: #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
        }

        /* Logo */
        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        /* Navigation links */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .nav-links a:hover {
            color: aqua;
        }

        /* Menu icon */
        .menu-icon {
            display: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;
            }

            .menu-icon {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background-color: #222;
                text-align: center;
                padding: 20px 0;
                gap: 20px;
            }

            .nav-links.active {
                display: flex;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            spider man
        </div>

        <div class="menu-icon" onclick="toggleMenu()">
            ☰
        </div>

        <ul class="nav-links" id="navLinks">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById("navLinks");

            navLinks.classList.toggle("active");
        }
    </script>

</body>

</html>
