<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Table</title>

    <style>
        table {
            width: 80%;
            margin: 50px auto;
            border-collapse: collapse;
            text-align: center;
            font-size: 22px;
        }

        th, td {
            border: 2px solid black;
            padding: 15px;
        }

        th {
            color: white;
        }

        th:nth-child(1) {
            background-color: #123477;
        }

        th:nth-child(2),
        th:nth-child(3) {
            background-color: #18a9df;
        }; 
        }
        th:nth-child(4) 
            background-color: #891216;
        };

        td {
            background-color: #f2f3f3;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th>Gender</th>
            <th>Age</th>
            <th>Name</th>
            <th>No</th>
        </tr>

        <tr>
            <td>Male</td>
            <td>32</td>
            <td>siva</td>
            <td>1</td>
        </tr>

        <tr>
            <td>Male</td>
            <td>22</td>
            <td>parath</td>
            <td>2</td>
        </tr>

        <tr>
            <td>FeMale</td>
            <td>30</td>
            <td>abaran</td>
            <td>3</td>
        </tr>

        <tr>
            <td>Male</td>
            <td>25</td>
            <td>viswa</td>
            <td>4</td>
        </tr>
    </table>

</body>
</html>
