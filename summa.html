<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Carousel</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background-color: #f2f2f2;
        }

        .carousel {
            max-width: 900px;
            margin: auto;
        }

        .carousel img {
            width: 100%;
            height: 450px;
            object-fit: cover;
        }

        h2 {
            text-align: center;
            margin: 30px;
            color: blue;
        }

    </style>

</head>

<body>

    <!-- Heading -->
    <h2>Bootstrap Image Carousel</h2>

    <div class="container">

        <!-- Carousel Start -->
        <div id="myCarousel" class="carousel slide"
            data-bs-ride="carousel"
            data-bs-interval="3000">

            <!-- Carousel Indicators -->
            <div class="carousel-indicators">

                <button type="button"
                    data-bs-target="#myCarousel"
                    data-bs-slide-to="0"
                    class="active">
                </button>

                <button type="button"
                    data-bs-target="#myCarousel"
                    data-bs-slide-to="1">
                </button>

                <button type="button"
                    data-bs-target="#myCarousel"
                    data-bs-slide-to="2">
                </button>

            </div>

            <!-- Carousel Inner -->
            <div class="carousel-inner">

                <!-- First Image -->
                <div class="carousel-item active">

                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwFGWUNEbsXg1qB5IgqP3Z
                    JyBAcuPi1wtRkHz5TmX78w&s=10" 
                        class="d-block w-70
                        alt="First Slide">

                    <div class="carousel-caption">
                        <h5>First Image</h5>
                        <p>Welcome to Bootstrap Carousel</p>
                    </div>

                </div>

                <!-- Second Image -->
                <div class="carousel-item">

                    <img src="https://picsum.photos/id/1018/1000/450"
                        class="d-block w-100"
                        alt="Second Slide">

                    <div class="carousel-caption">
                        <h5>Second Image</h5>
                        <p>Beautiful Nature</p>
                    </div>

                </div>

                <!-- Third Image -->
                <div class="carousel-item">

                    <img src="https://picsum.photos/id/1019/1000/450"
                        class="d-block w-100"
                        alt="Third Slide">

                    <div class="carousel-caption">
                        <h5>Third Image</h5>
                        <p>Explore the World</p>
                    </div>

                </div>

            </div>

            <!-- Previous Button -->
            <button class="carousel-control-prev"
                type="button"
                data-bs-target="#myCarousel"
                data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

                <span class="visually-hidden">Previous</span>

            </button>

            <!-- Next Button -->
            <button class="carousel-control-next"
                type="button"
                data-bs-target="#myCarousel"
                data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

                <span class="visually-hidden">Next</span>

            </button>

        </div>
        <!-- Carousel End -->

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
