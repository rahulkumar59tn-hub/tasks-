<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding:0px;
            box-sizing: border-box;
        }
        .main{
            width:100%;
            height:100vh;
            background-color: rgba(235, 121, 121, 0.856);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .inner{
            width:330px;
            height:400px;
            /* background-color: red; */
            border-radius: 5px;
        }
        .head{
            width:100%;
            height:30%;
            background-color:rgb(248, 0, 0);
            border-top-left-radius: 5px;
            border-top-right-radius:5px ;
        }
        .mid{
            width:100%;
            height:50%;
            background-color: rgb(46, 166, 218);
            position: relative;
            font-size: larger;
        
        }
        .foot{
            width:100%;
            height:20%;
            background-color: rgb(46, 166, 218);
            border-top: 1px solid rgb(46, 166, 218);
            border-bottom-left-radius: 5px;
            border-bottom-right-radius:5px ;
            
        }
        .image{
            width:120px;
            height: 120px;
            position: absolute;
            left:33%;
            top:-25%;
            border-radius: 50%;
            border: 5px solid rgb(64, 3, 3);
        }
        .para1{
           /* background-color: rgb(245, 252, 252);*/
            position: absolute;
            top:100px;
            left: 27%;
            font-size: 25px;
            letter-spacing:2px;
        }
        .para2{
            position: absolute;
            /* background-color: rgb(127, 229, 255); */
            top:150px;
            left:37%;
            font: size: 40px;
            letter: spacing :1px;
        }

    </style>
</head>
<body>
    <div class="main">
        <div class="inner">
            <div class="sub head"></div>
            <div class="sub mid">
                <img src="i am spider.jpg" alt="" class = "image">
                <p class = "para1">i am spider </p>
                <p class = "para2">New York </p>
            </div>
            <div class="sub foot"></div>
        </div>
    </div>
    
</body>
</html>
