<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Cards</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 20px auto;
            padding: 25px;
            background-color: white;
            border-radius: 25px;
        }

  
        .hero-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 20px;
            display: block;
        }

   
        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-top: 25px;
        }

        .card {
            background-color: #f5f5f5;
            padding: 30px;
            border-radius: 20px;
        }

        .card h2 {
            color: #16466b;
            margin-bottom: 18px;
            font-size: 26px;
        }

        .card p {
            color: #555;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .btn {
            display: inline-block;
            background-color: #16466b;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 7px;
            font-size: 14px;
        }

        .btn:hover {
            background-color: #0d304a;
        }


       

        @media screen and (max-width: 1024px) {

            .container {
                width: 92%;
                padding: 22px;
            }

            .hero-img {
                height: 300px;
            }

            .card {
                padding: 25px;
            }

            .card h2 {
                font-size: 23px;
            }

            .card p {
                font-size: 15px;
            }
        }


       

        @media screen and (max-width: 767px) {

            .container {
                width: 95%;
                padding: 15px;
                margin: 10px auto;
                border-radius: 18px;
            }

            .hero-img {
                height: 200px;
                border-radius: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
                gap: 15px;
                margin-top: 15px;
            }

            .card {
                padding: 20px;
                border-radius: 15px;
            }

            .card h2 {
                font-size: 21px;
                margin-bottom: 12px;
            }

            .card p {
                font-size: 14px;
                line-height: 1.6;
                margin-bottom: 18px;
            }

            .btn {
                padding: 10px 24px;
                font-size: 13px;
            }
        }



        @media screen and (max-width: 480px) {

            .hero-img {
                height: 170px;
            }

            .card {
                padding: 18px;
            }

            .card h2 {
                font-size: 19px;
            }

            .card p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="WhatsApp Image 2026-10-08 at 19.54.07.jpeg" class="hero-img" alt="Web Development">

        <div class="cards">

            <div class="card">
                <h2>Web Development</h2>

                <p>
                    Learn HTML, CSS and JavaScript with practical
                    projects and responsive website development.
                </p>

                <a href="#" class="btn">Learn More</a>
            </div>


            <div class="card">
                <h2>Responsive Design</h2>

                <p>
                    Create websites that automatically adjust their
                    layout according to desktop, tablet and mobile screens.
                </p>

                <a href="#" class="btn">Explore</a>
            </div>

        </div>

    </div>

</body>
</html>
