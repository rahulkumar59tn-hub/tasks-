   let deptPerformance = employees.reduce((acc, val) => {
    if (!acc[val.department]) {
        acc[val.department] = {
            total: 0,
            count: 0
        };
    }

    acc[val.department].total += val.performance;
    acc[val.department].count++;

    return acc;
}, {});

    let averagePerformance = Object.keys(deptPerformance).map((val) => {
    return {
        department: val,
        average: deptPerformance[val].total / deptPerformance[val].count
    };
});

    console.log(averagePerformance);


    let lowPerformanceDept = employees.filter((val, ind, arr) => val.performance < 60).map((val, ind, arr) => val.department).filter((val, ind, arr) => arr.indexOf(val) == ind);

    let deptReport = employees.reduce((acc, val) => {
    if (!acc[val.department]) {
        acc[val.department] = {
            count: 0,
            salary: 0,
            performance: 0
        };
    }

    acc[val.department].count++;
    acc[val.department].salary += val.salary;
    acc[val.department].performance += val.performance;

    return acc;
}, {});

   let finalDeptReport = Object.keys(deptReport).map((val) => {
    return {

        employeeCount: deptReport[val].count,
        totalSalary: deptReport[val].salary,

    };
});
