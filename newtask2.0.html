<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Management & Performance Analytics</title>
<style>

:root {
  --nav: #1b2540; --nav2: #2d3a5a; --pri: #2563eb; --bg: #f4f6fa;
  --txt: #1d2433; --mut: #667085; --bad: #c62828; --line: #e3e7f0; --gap: 16px;
}
* { box-sizing: border-box; }
body {
  margin: 0; display: flex; min-height: 100vh;
  font-family: system-ui, "Segoe UI", Arial, sans-serif;
  background: var(--bg); color: var(--txt);
}

/* ---------- 2. Layout ---------- */
aside { width: 260px; background: var(--nav); padding: 16px; flex-shrink: 0; }
aside h2 { color: #29b6f6; margin: 4px 0 24px; font-size: 1.4rem; }
#nav button {
  display: block; width: 100%; text-align: left; background: none;
  color: #a9b4cc; padding: 14px 16px; margin-bottom: 4px; font-size: 1rem; border-radius: 8px;
}
#nav button.on { background: var(--nav2); color: #fff; }
main { flex: 1; padding: 24px; min-width: 0; }
h2.t { font-size: 2rem; margin: 0 0 20px; }

/* ---------- 3. Cards & grids ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--gap); margin-bottom: var(--gap); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--gap); margin-bottom: var(--gap); }
.card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: var(--gap); }
.cards .card, .grid3 .card { margin: 0; }
.cards .card { text-align: center; padding: 26px 10px; }
.card h3 { margin: 0 0 10px; font-size: 1.05rem; }
.big { font-size: 1.9rem; font-weight: 700; color: var(--pri); }

/* ---------- 4. Progress bars ---------- */
.bl { margin: 8px 0; font-size: .85rem; }
.bh { display: flex; justify-content: space-between; }
.bt { background: #e3e7f0; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 3px; }
.bt i { display: block; height: 100%; background: var(--pri); }

/* ---------- 5. Tables ---------- */
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: #fff; }
th, td { padding: 9px; border-bottom: 1px solid var(--line); text-align: left; font-size: .9rem; }
th[data-sort] { cursor: pointer; }

/* ---------- 6. Buttons & form controls ---------- */
button { background: var(--pri); color: #fff; border: 0; padding: 8px 13px; border-radius: 6px; cursor: pointer; font: inherit; }
button.sec { background: #8993a8; }
button.del { background: var(--bad); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: var(--gap); }
input, select, textarea { padding: 8px; border: 1px solid #bcc3d4; border-radius: 6px; font: inherit; width: 100%; }
.tools input, .tools select { width: auto; }
label { display: block; margin-bottom: 8px; font-size: .9rem; }
.err { color: var(--bad); display: block; min-height: 1em; }
.row { display: flex; gap: 8px; margin-top: 8px; }

/* ---------- 7. Misc components ---------- */
.tag { padding: 2px 8px; border-radius: 10px; font-size: .75rem; color: #fff; background: var(--bad); }
.av {
  display: inline-flex; width: 34px; height: 34px; border-radius: 50%; background: var(--pri);
  color: #fff; align-items: center; justify-content: center; font-size: .8rem; object-fit: cover;
}
dialog { border: 0; border-radius: 10px; width: min(500px, 94vw); max-height: 90vh; }
dialog::backdrop { background: #0006; }
.empty { text-align: center; padding: 24px; color: var(--mut); }
ul.rules li { margin-bottom: 6px; }

/* ---------- 8. Responsive & print ---------- */
@media (max-width: 800px) {
  body { flex-direction: column; }
  aside { width: auto; }
  #nav { display: flex; flex-wrap: wrap; gap: 4px; }
  #nav button { width: auto; padding: 8px 12px; margin: 0; }
}
@media print {
  aside, .tools, button { display: none; }
}
</style>
</head>
<body>
<aside>
  <h2>SM-Peter Parker</h2>
  <nav id="nav"></nav>
</aside>
<main id="main"></main>
<dialog id="dlg"></dialog>

<script>
/* =====================================================
   1. CONFIG
   ===================================================== */
const CFG = {
  KEY: 'mgi_student_system_v2',
  COURSES: ['Web Development', 'Data Science', 'UI/UX Design', 'Cybersecurity'],
  STATUS: ['Active', 'Inactive', 'Completed'],
  ATT: ['Present', 'Absent', 'Leave'],
  TASK: ['Pending', 'In Progress', 'Completed'],
  ACT: ['Positive', 'Negative'],
  VIEWS: [
    ['dashboard', 'Dashboard'], ['students', 'Students'], ['attendance', 'Attendance'], ['tasks', 'Tasks'],
    ['activities', 'Activities'], ['analysis', 'Analysis & Rules'], ['reports', 'Reports & Export'], ['data', 'Data Management']
  ]
};

/* =====================================================
   2. STORAGE (only place that touches localStorage)
   ===================================================== */
const Store = {
  data: { students: [], attendance: [], tasks: [], activities: [] },

  load() {
    try {
      const d = JSON.parse(localStorage.getItem(CFG.KEY));
      if (d && Array.isArray(d.students)) this.data = { attendance: [], tasks: [], activities: [], ...d };
    } catch (e) {
      console.warn('Corrupted storage, starting fresh', e);
    }
  },

  save() {
    try {
      localStorage.setItem(CFG.KEY, JSON.stringify(this.data));
      return true;
    } catch (e) {
      alert('Could not save data (storage full?): ' + e.message);
      return false;
    }
  },

  uid: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6),

  addAttendance(r) { // one record per student per date, enforced here
    if (this.data.attendance.some(a => a.sid === r.sid && a.date === r.date)) return false;
    this.data.attendance.push({ id: this.uid(), ...r });
    return true;
  },

  related(sid) {
    const d = this.data;
    return {
      att: d.attendance.filter(a => a.sid === sid).length,
      tasks: d.tasks.filter(t => t.sid === sid).length,
      acts: d.activities.filter(a => a.sid === sid).length
    };
  },

  removeStudent(sid) {
    const d = this.data;
    d.students = d.students.filter(s => s.id !== sid);
    ['attendance', 'tasks', 'activities'].forEach(k => d[k] = d[k].filter(x => x.sid !== sid));
  }
};

/* =====================================================
   3. CALCULATIONS (no DOM)
   ===================================================== */
const Calc = {
  today() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  },

  pct: recs => recs.length
    ? Math.round(recs.filter(r => r.status === 'Present').length / recs.length * 1000) / 10
    : null,

  overdue: t => t.status !== 'Completed' && t.due < Calc.today(),

  points(acts) {
    const sum = ty => acts.filter(a => a.type === ty).reduce((s, a) => s + a.points, 0);
    return { pos: sum('Positive'), neg: sum('Negative'), net: sum('Positive') - sum('Negative') };
  },

  fmt: v => v == null ? 'N/A' : v + '%',

  stats(sid) {
    const d = Store.data;
    const att = d.attendance.filter(a => a.sid === sid);
    const tk = d.tasks.filter(t => t.sid === sid);
    return {
      att: this.pct(att),
      days: att.length,
      tasks: tk.length,
      done: tk.filter(t => t.status === 'Completed').length,
      over: tk.filter(this.overdue).length,
      ...this.points(d.activities.filter(a => a.sid === sid))
    };
  }
};

/* =====================================================
   4. HELPERS
   ===================================================== */
const $ = s => document.querySelector(s);
const D = () => Store.data;
const find = (arr, id) => arr.find(x => x.id === id);
const nameOf = id => (find(D().students, id) || {}).name || 'Unknown';
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s));
const inRange = (d, a, b) => (!a || d >= a) && (!b || d <= b);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

const bar = (l, v, m, s = '') => `
  <div class="bl">
    <div class="bh"><span>${esc(l)}</span><span>${v}${s}</span></div>
    <div class="bt"><i style="width:${m ? Math.max(0, Math.round(v / m * 100)) : 0}%"></i></div>
  </div>`;

const av = s => s.photo && s.photo.startsWith('data:image/')
  ? `<img class="av" src="${esc(s.photo)}" alt="">`
  : `<span class="av">${esc(s.name.slice(0, 2).toUpperCase())}</span>`;

const studentOpts = () => D().students
  .map(s => `<option value="${s.id}">${esc(s.name)} (${esc(s.studentId)})</option>`)
  .join('');

let view = 'dashboard';
const ui = { q: '', course: '', batch: '', status: '', sort: 'name', dir: 1, attDate: Calc.today() };

function resizeImg(file) { // compress profile photo to max 200px JPEG
  return new Promise((ok, no) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const r = Math.min(1, 200 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = im.width * r;
      c.height = im.height * r;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      ok(c.toDataURL('image/jpeg', 0.7));
    };
    im.onerror = () => no(new Error('Invalid image file'));
    im.src = u;
  });
}

function csvDown(name, rows) {
  const t = rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' }));
  a.download = name;
  a.click();
}

/* generic form dialog with inline validation */
function openForm(title, fields, vals, validate, onOk) {
  const dlg = $('#dlg');

  const input = f => {
    if (f.t === 'select') {
      return `<select name="${f.n}">${f.o.map(o => `<option value="${esc(o.v ?? o)}">${esc(o.l ?? o)}</option>`).join('')}</select>`;
    }
    if (f.t === 'textarea') return `<textarea name="${f.n}" rows="3"></textarea>`;
    return `<input name="${f.n}" type="${f.t || 'text'}"${f.t === 'file' ? ' accept="image/*"' : ''}>`;
  };

  dlg.innerHTML = `<form novalidate><h3>${esc(title)}</h3>
    ${fields.map(f => `<label>${esc(f.l)}${f.req ? ' *' : ''}
      ${input(f)}
      <small class="err" data-e="${f.n}"></small></label>`).join('')}
    <div class="row"><button>Save</button><button type="button" class="sec" id="cx">Cancel</button></div></form>`;

  const fm = dlg.querySelector('form');
  fields.forEach(f => { if (f.t !== 'file') fm.elements[f.n].value = vals[f.n] ?? ''; });
  $('#cx').onclick = () => dlg.close();

  fm.onsubmit = async e => {
    e.preventDefault();
    const v = {};
    fields.forEach(f => v[f.n] = f.t === 'file' ? (fm.elements[f.n].files[0] || null) : fm.elements[f.n].value.trim());

    const errs = validate(v);
    dlg.querySelectorAll('.err').forEach(x => x.textContent = errs[x.dataset.e] || '');
    const first = Object.keys(errs)[0];
    if (first) return fm.elements[first].focus();

    try { await onOk(v); }
    catch (x) { return alert('Error: ' + x.message); }

    Store.save();
    dlg.close();
    render();
  };
  dlg.showModal();
}

/* =====================================================
   5. VIEW: DASHBOARD
   ===================================================== */
function rDash() {
  const d = D(), t = Calc.today();
  const act = d.students.filter(s => s.status === 'Active');
  const tr = d.attendance.filter(a => a.date === t);
  const c = s => tr.filter(a => a.status === s).length;
  const tc = s => d.tasks.filter(x => x.status === s).length;
  const od = d.tasks.filter(Calc.overdue).length;
  const done = d.tasks.length ? Math.round(tc('Completed') / d.tasks.length * 100) : null;
  const pts = Calc.points(d.activities);
  const rank = d.students
    .map(s => ({ s, n: Calc.points(d.activities.filter(a => a.sid === s.id)).net }))
    .sort((a, b) => b.n - a.n);
  const mc = Math.max(1, ...CFG.COURSES.map(k => d.students.filter(s => s.course === k).length));
  const notMarked = act.filter(s => !tr.some(a => a.sid === s.id)).length;

  $('#main').innerHTML = `<h2 class="t">Dashboard</h2>
    ${d.students.length ? '' : '<div class="card empty">No data yet. Add a student in <b>Students</b> or load sample data in <b>Data Management</b>.</div>'}

    <div class="cards">
      <div class="card"><h3>Total Students</h3><div class="big">${d.students.length}</div></div>
      <div class="card"><h3>Active Students</h3><div class="big">${act.length}</div></div>
      <div class="card"><h3>Today Attendance</h3><div class="big">${Calc.fmt(Calc.pct(tr))}</div></div>
      <div class="card"><h3>Task Completion</h3><div class="big">${Calc.fmt(done)}</div></div>
      <div class="card"><h3>Net Points</h3><div class="big">${pts.net}</div></div>
    </div>

    <div class="grid3">
      <div class="card"><h3>Today's Attendance Breakdown</h3>
        ${CFG.ATT.map(s => bar(s, c(s), tr.length || 1)).join('')}${bar('Not Marked', notMarked, act.length)}</div>
      <div class="card"><h3>Course Distribution</h3>
        ${CFG.COURSES.map(k => bar(k, d.students.filter(s => s.course === k).length, mc)).join('')}</div>
      <div class="card"><h3>Task Status Distribution</h3>
        ${CFG.TASK.map(s => bar(s, tc(s), d.tasks.length)).join('')}${bar('Overdue', od, d.tasks.length)}</div>
    </div><br>

    <div class="grid3">
      <div class="card"><h3>Overall Attendance</h3>
        ${bar('Present %', Calc.pct(d.attendance) || 0, 100, '%')}<p>Total points: +${pts.pos} / -${pts.neg}</p></div>
      <div class="card"><h3>Top 5 by Net Points</h3>
        ${rank.slice(0, 5).map(r => bar(r.s.name, r.n, Math.max(1, rank[0].n))).join('') || '<p class="empty">N/A</p>'}</div>
      <div class="card"><h3>Bottom 5 by Net Points</h3>
        ${rank.slice(-5).reverse().map(r => bar(r.s.name, r.n, Math.max(1, Math.abs(rank[0].n)))).join('') || '<p class="empty">N/A</p>'}</div>
    </div>`;
}

/* =====================================================
   6. VIEW: STUDENTS
   ===================================================== */
const stuFields = () => [
  { n: 'studentId', l: 'Student ID', req: 1 },
  { n: 'name', l: 'Full Name', req: 1 },
  { n: 'phone', l: 'Phone', req: 1 },
  { n: 'email', l: 'Email', t: 'email' },
  { n: 'address', l: 'Address' },
  { n: 'course', l: 'Course', t: 'select', o: CFG.COURSES, req: 1 },
  { n: 'batch', l: 'Batch', req: 1 },
  { n: 'joined', l: 'Joining Date', t: 'date', req: 1 },
  { n: 'status', l: 'Status', t: 'select', o: CFG.STATUS },
  { n: 'progress', l: 'Course Progress (0-100)', t: 'number' },
  { n: 'photo', l: 'Profile Photo', t: 'file' }
];

function validateStudent(v, editId) {
  const e = {};
  if (!v.studentId) e.studentId = 'Required';
  else if (D().students.some(s => s.id !== editId && s.studentId.toLowerCase() === v.studentId.toLowerCase())) e.studentId = 'Student ID already exists';

  if (!/^[A-Za-z .'-]{2,60}$/.test(v.name)) e.name = '2-60 characters: letters, spaces, apostrophe, hyphen, full stop';
  if (!/^\+?\d{10,15}$/.test(v.phone)) e.phone = '10-15 digits, optional leading +';
  if (v.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) e.email = 'Invalid email';
  if (v.batch.length < 2 || v.batch.length > 30) e.batch = '2-30 characters';
  if (!validDate(v.joined)) e.joined = 'Valid date required';

  const p = v.progress === '' ? 0 : Number(v.progress);
  if (!Number.isInteger(p) || p < 0 || p > 100) e.progress = 'Whole number 0-100';
  if (v.photo && (!v.photo.type.startsWith('image/') || v.photo.size > 3e6)) e.photo = 'Image file under 3 MB required';
  return e;
}

function studentForm(s) {
  const base = s || { status: 'Active', course: CFG.COURSES[0], joined: Calc.today(), progress: 0 };
  openForm(s ? 'Edit Student' : 'Add Student', stuFields(), base, v => validateStudent(v, s && s.id), async v => {
    v.photo = v.photo ? await resizeImg(v.photo) : (s && s.photo) || '';
    v.progress = v.progress === '' ? 0 : Number(v.progress);
    const now = new Date().toISOString();
    if (s) Object.assign(s, v, { updated: now });
    else D().students.push({ id: Store.uid(), ...v, created: now, updated: now });
  });
}

function filteredStudents() {
  const q = ui.q.trim().toLowerCase();
  return D().students
    .filter(s =>
      (!q || s.name.toLowerCase().includes(q) || s.studentId.toLowerCase().includes(q)) &&
      (!ui.course || s.course === ui.course) &&
      (!ui.batch || s.batch === ui.batch) &&
      (!ui.status || s.status === ui.status))
    .sort((a, b) => {
      const k = ui.sort === 'id' ? 'studentId' : ui.sort === 'date' ? 'joined' : 'name';
      return a[k].localeCompare(b[k]) * ui.dir;
    });
}

function rStuTable() {
  const list = filteredStudents();
  $('#count').textContent = `${list.length} student(s) found`;
  $('#stbody').innerHTML = list.length
    ? list.map(s => `<tr>
        <td>${av(s)}</td><td>${esc(s.studentId)}</td><td>${esc(s.name)}</td>
        <td>${esc(s.course)}</td><td>${esc(s.batch)}</td><td>${esc(s.status)}</td>
        <td><button data-a="profile" data-id="${s.id}">View</button>
            <button data-a="editS" data-id="${s.id}">Edit</button>
            <button class="del" data-a="delS" data-id="${s.id}">Delete</button></td></tr>`).join('')
    : '<tr><td colspan="7" class="empty">No students match. Add a student or clear filters.</td></tr>';
}

function rStu() {
  const opts = (arr, cur, all) => `<option value="">${all}</option>` +
    arr.map(x => `<option ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const batches = [...new Set(D().students.map(s => s.batch))];

  $('#main').innerHTML = `<h2 class="t">Students</h2>
    <div class="tools">
      <input id="q" placeholder="Search name or ID" value="${esc(ui.q)}">
      <select id="fc">${opts(CFG.COURSES, ui.course, 'All courses')}</select>
      <select id="fb">${opts(batches, ui.batch, 'All batches')}</select>
      <select id="fs">${opts(CFG.STATUS, ui.status, 'All statuses')}</select>
      <button class="sec" data-a="clear">Clear filters</button>
      <button data-a="addS">+ Add Student</button>
    </div>
    <p id="count"></p>
    <div class="tbl"><table>
      <thead><tr><th>Photo</th><th data-sort="id">ID ↕</th><th data-sort="name">Name ↕</th>
        <th>Course</th><th>Batch</th><th>Status</th><th data-sort="date">Actions (sort by date ↕)</th></tr></thead>
      <tbody id="stbody"></tbody>
    </table></div>`;
  rStuTable();
}

function profile(s) {
  const d = D(), st = Calc.stats(s.id);
  const att = d.attendance.filter(a => a.sid === s.id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);

  $('#dlg').innerHTML = `<h3>${av(s)} ${esc(s.name)} (${esc(s.studentId)})</h3>
    <p>${esc(s.course)} · ${esc(s.batch)} · ${esc(s.status)}<br>
    Phone: ${esc(s.phone)} · ${esc(s.email || '-')}<br>
    Address: ${esc(s.address || '-')}<br>
    Joined: ${esc(s.joined)}<br>
    Created: ${esc(s.created.slice(0, 10))} · Updated: ${esc(s.updated.slice(0, 10))}</p>
    ${bar('Course Progress', s.progress, 100, '%')}
    <p>Attendance: ${Calc.fmt(st.att)} (${st.days} days)<br>
    Tasks: ${st.done}/${st.tasks} completed, ${st.over} overdue<br>
    Points: +${st.pos} / -${st.neg} = ${st.net}</p>
    <p><b>Recent attendance:</b> ${att.map(a => `${esc(a.date)} ${esc(a.status)}`).join(', ') || 'None'}</p>
    <div class="row"><button id="cx">Close</button></div>`;
  $('#cx').onclick = () => $('#dlg').close();
  $('#dlg').showModal();
}

/* =====================================================
   7. VIEW: ATTENDANCE
   ===================================================== */
function rAtt() {
  const d = D();
  const recs = d.attendance.filter(a => a.date === ui.attDate);
  const list = d.students.filter(s => s.status === 'Active');

  const row = s => {
    const r = recs.find(x => x.sid === s.id) || {};
    const radios = CFG.ATT.map(a =>
      `<label style="display:inline-block;margin-right:8px"><input type="radio" style="width:auto" name="r${s.id}" value="${a}" ${r.status === a ? 'checked' : ''}> ${a}</label>`
    ).join('');
    return `<tr data-sid="${s.id}"><td>${esc(s.name)}</td><td>${radios}</td>
      <td><input maxlength="200" value="${esc(r.remark || '')}"></td></tr>`;
  };

  $('#main').innerHTML = `<h2 class="t">Attendance</h2>
    <div class="tools">
      <input type="date" id="ad" max="${Calc.today()}" value="${ui.attDate}">
      <button data-a="allP">Mark all Present</button>
      <button data-a="saveAtt">Save Attendance</button>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>Student</th><th>Status</th><th>Remark</th></tr></thead>
      <tbody>${list.length ? list.map(row).join('') : '<tr><td colspan="3" class="empty">No active students.</td></tr>'}</tbody>
    </table></div>`;
}

function saveAtt() {
  let n = 0;
  document.querySelectorAll('tbody tr[data-sid]').forEach(tr => {
    const c = tr.querySelector('input[type=radio]:checked');
    if (!c) return;
    const sid = tr.dataset.sid;
    const remark = tr.querySelector('input[maxlength]').value.trim();
    const ex = D().attendance.find(a => a.sid === sid && a.date === ui.attDate);
    if (ex) Object.assign(ex, { status: c.value, remark });
    else Store.addAttendance({ sid, date: ui.attDate, status: c.value, remark });
    n++;
  });
  if (Store.save()) { alert(`${n} record(s) saved.`); render(); }
}

/* =====================================================
   8. VIEW: TASKS
   ===================================================== */
function setTask(t, v) {
  Object.assign(t, v);
  if (t.status === 'Completed') t.completed = t.completed || Calc.today();
  else delete t.completed;
}

function taskForm(t) {
  if (!D().students.length) return alert('Add a student first.');
  const f = [
    { n: 'sid', l: 'Student', t: 'select', o: D().students.map(s => ({ v: s.id, l: `${s.name} (${s.studentId})` })) },
    { n: 'title', l: 'Title', req: 1 },
    { n: 'desc', l: 'Description', t: 'textarea' },
    { n: 'assigned', l: 'Assigned date', t: 'date' },
    { n: 'due', l: 'Due date', t: 'date', req: 1 },
    { n: 'status', l: 'Status', t: 'select', o: CFG.TASK }
  ];

  const validate = v => {
    const e = {};
    if (v.title.length < 3 || v.title.length > 100) e.title = '3-100 characters';
    if (v.desc.length > 500) e.desc = 'Max 500 characters';
    if (!validDate(v.assigned)) e.assigned = 'Valid date required';
    if (!validDate(v.due)) e.due = 'Valid date required';
    else if (v.due < v.assigned) e.due = 'Due date cannot be before assigned date';
    return e;
  };

  const save = v => {
    if (t) setTask(t, v);
    else { const n = { id: Store.uid() }; setTask(n, v); D().tasks.push(n); }
  };

  openForm(t ? 'Edit Task' : 'Add Task', f, t || { assigned: Calc.today(), status: 'Pending' }, validate, save);
}

function rTask() {
  const rows = D().tasks.map(t => `<tr>
    <td>${esc(nameOf(t.sid))}</td><td>${esc(t.title)}</td><td>${esc(t.due)}</td>
    <td><select data-a="tstat" data-id="${t.id}">${CFG.TASK.map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
      ${Calc.overdue(t) ? '<span class="tag">Overdue</span>' : ''}</td>
    <td><button data-a="editT" data-id="${t.id}">Edit</button>
        <button class="del" data-a="delT" data-id="${t.id}">Delete</button></td></tr>`).join('');

  $('#main').innerHTML = `<h2 class="t">Tasks</h2>
    <div class="tools"><button data-a="addT">+ Add Task</button></div>
    <div class="tbl"><table>
      <thead><tr><th>Student</th><th>Task</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">No tasks yet.</td></tr>'}</tbody>
    </table></div>`;
}

/* =====================================================
   9. VIEW: ACTIVITIES
   ===================================================== */
function actForm() {
  if (!D().students.length) return alert('Add a student first.');
  const f = [
    { n: 'sid', l: 'Student', t: 'select', o: D().students.map(s => ({ v: s.id, l: `${s.name} (${s.studentId})` })) },
    { n: 'title', l: 'Activity / behaviour', req: 1 },
    { n: 'type', l: 'Type', t: 'select', o: CFG.ACT },
    { n: 'points', l: 'Points (1-100)', t: 'number', req: 1 },
    { n: 'date', l: 'Date', t: 'date' }
  ];

  const validate = v => {
    const e = {}, p = Number(v.points);
    if (v.title.length < 3) e.title = 'At least 3 characters';
    if (!Number.isInteger(p) || p < 1 || p > 100) e.points = 'Whole number 1-100';
    if (!validDate(v.date)) e.date = 'Valid date required';
    return e;
  };

  openForm('Add Activity', f, { date: Calc.today(), type: 'Positive' }, validate,
    v => D().activities.push({ id: Store.uid(), ...v, points: Number(v.points) }));
}

function rAct() {
  const rows = D().activities.map(a => `<tr>
    <td>${esc(nameOf(a.sid))}</td><td>${esc(a.title)}</td><td>${esc(a.type)}</td>
    <td>${a.type === 'Positive' ? '+' : '-'}${a.points}</td><td>${esc(a.date)}</td>
    <td><button class="del" data-a="delA" data-id="${a.id}">Delete</button></td></tr>`).join('');

  $('#main').innerHTML = `<h2 class="t">Activities</h2>
    <div class="tools"><button data-a="addA">+ Add Activity</button></div>
    <div class="tbl"><table>
      <thead><tr><th>Student</th><th>Activity</th><th>Type</th><th>Points</th><th>Date</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">No activities yet.</td></tr>'}</tbody>
    </table></div>`;
}

/* =====================================================
   10. VIEW: ANALYSIS & RULES
   ===================================================== */
function rAna() {
  $('#main').innerHTML = `<h2 class="t">Analysis & Rules</h2>
    <div class="card"><h3>Compare two students</h3>
      <div class="tools"><select id="ca">${studentOpts()}</select> vs <select id="cb">${studentOpts()}</select>
      <button data-a="cmp">Compare</button></div>
      <div id="aout"></div></div>
    <div class="card"><h3>Business Rules (assumed formulas)</h3>
      <ul class="rules">
        <li>Attendance % = Present days ÷ total recorded days × 100 (Leave counts in the total). No records = N/A.</li>
        <li>Net points = total positive points − total negative points.</li>
        <li>Task completion = Completed tasks ÷ all tasks × 100.</li>
        <li>A task is Overdue when its due date is before today and it is not Completed. Overdue is calculated on display, never stored.</li>
        <li>One attendance record per student per date. Future dates are not allowed.</li>
        <li>Deleting a student also deletes that student's attendance, tasks and activities.</li>
      </ul></div>`;
}

function compare() {
  const a = find(D().students, $('#ca').value);
  const b = find(D().students, $('#cb').value);
  if (!a || !b) return $('#aout').innerHTML = '<p class="empty">Add at least one student.</p>';

  const x = Calc.stats(a.id), y = Calc.stats(b.id);
  const row = (l, p, q) => `<tr><td>${l}</td><td>${p}</td><td>${q}</td></tr>`;

  $('#aout').innerHTML = `<div class="tbl"><table>
    <thead><tr><th>Metric</th><th>${esc(a.name)}</th><th>${esc(b.name)}</th></tr></thead>
    <tbody>
      ${row('Attendance', Calc.fmt(x.att), Calc.fmt(y.att))}
      ${row('Tasks completed', `${x.done}/${x.tasks}`, `${y.done}/${y.tasks}`)}
      ${row('Overdue tasks', x.over, y.over)}
      ${row('Net points', x.net, y.net)}
      ${row('Course progress', a.progress + '%', b.progress + '%')}
    </tbody></table></div>`;
}

/* =====================================================
   11. VIEW: REPORTS & EXPORT
   ===================================================== */
function rRep() {
  const t = Calc.today();
  $('#main').innerHTML = `<h2 class="t">Reports & Export</h2>
    <div class="card"><h3>Student-wise attendance</h3>
      <div class="tools"><select id="rs">${studentOpts()}</select>
      From <input type="date" id="r1"> To <input type="date" id="r2">
      <button data-a="repS">Run</button></div></div>
    <div class="card"><h3>Date-wise attendance</h3>
      <div class="tools">From <input type="date" id="d1" value="${t}"> To <input type="date" id="d2" value="${t}">
      <button data-a="repD">Run</button></div></div>
    <div class="card"><h3>Export</h3>
      <div class="tools"><button data-a="csvS">Students CSV</button>
      <button data-a="csvA">Attendance CSV</button>
      <button class="sec" data-a="print">Print / Save as PDF</button></div></div>
    <div id="rout"></div>`;
}

function repStudent() {
  const s = find(D().students, $('#rs').value);
  if (!s) return;
  const recs = D().attendance
    .filter(a => a.sid === s.id && inRange(a.date, $('#r1').value, $('#r2').value))
    .sort((a, b) => a.date.localeCompare(b.date));
  const c = k => recs.filter(r => r.status === k).length;

  $('#rout').innerHTML = `<div class="card">
    <h3>${esc(s.name)}: Present ${c('Present')}, Absent ${c('Absent')}, Leave ${c('Leave')}, Total ${recs.length}, Attendance ${Calc.fmt(Calc.pct(recs))}</h3>
    <div class="tbl"><table>
      <thead><tr><th>Date</th><th>Status</th><th>Remark</th></tr></thead>
      <tbody>${recs.map(r => `<tr><td>${esc(r.date)}</td><td>${esc(r.status)}</td><td>${esc(r.remark)}</td></tr>`).join('')
        || '<tr><td colspan="3" class="empty">No records in this range.</td></tr>'}</tbody>
    </table></div></div>`;
}

function repDate() {
  const a = $('#d1').value, b = $('#d2').value, d = D();
  const act = d.students.filter(s => s.status === 'Active');
  const dates = [...new Set(d.attendance.filter(r => inRange(r.date, a, b)).map(r => r.date))].sort();

  const rows = dates.map(dt => {
    const r = d.attendance.filter(x => x.date === dt);
    const c = k => r.filter(x => x.status === k).length;
    const missing = act.filter(s => !r.some(x => x.sid === s.id)).length;
    return `<tr><td>${esc(dt)}</td><td>${c('Present')}</td><td>${c('Absent')}</td><td>${c('Leave')}</td><td>${missing}</td></tr>`;
  }).join('');

  let detail = '';
  if (a && a === b) {
    detail = `<h3>Status on ${esc(a)}</h3><ul>${d.students.map(s => {
      const r = d.attendance.find(x => x.sid === s.id && x.date === a);
      return `<li>${esc(s.name)}: ${r ? esc(r.status) : 'Not Marked'}</li>`;
    }).join('')}</ul>`;
  }

  $('#rout').innerHTML = `<div class="card"><div class="tbl"><table>
    <thead><tr><th>Date</th><th>Present</th><th>Absent</th><th>Leave</th><th>Not Marked</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="5" class="empty">No records in this range.</td></tr>'}</tbody>
    </table></div>${detail}</div>`;
}

/* =====================================================
   12. VIEW: DATA MANAGEMENT
   ===================================================== */
function rData() {
  $('#main').innerHTML = `<h2 class="t">Data Management</h2>
    <div class="card"><h3>Backup & restore</h3>
      <div class="tools"><button data-a="expJ">Export JSON backup</button>
      <label style="margin:0">Import JSON: <input type="file" id="imp" accept=".json"></label></div></div>
    <div class="card"><h3>Sample data & reset</h3>
      <div class="tools"><button class="sec" data-a="sample">Load sample data</button>
      <button class="del" data-a="wipe">Delete ALL data</button></div></div>`;
}

function loadSample() {
  const names = ['Aisha Khan', "Liam O'Brien", 'Maria Garcia', 'Chen Wei', 'Sara Ali'];
  const t = Calc.today(), now = new Date().toISOString();
  const past = n => {
    const x = new Date();
    x.setDate(x.getDate() - n);
    return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  };

  names.forEach((n, i) => {
    const sid = 'MGI-S' + Date.now().toString().slice(-4) + i, id = Store.uid();

    D().students.push({
      id, studentId: sid, name: n, phone: '+9715000000' + i, email: '', address: '',
      course: CFG.COURSES[i % 4], batch: 'B1', joined: past(60), status: 'Active',
      progress: (20 * (i + 1)) % 100, photo: '', created: now, updated: now
    });

    [1, 2, 3].forEach(k => Store.addAttendance({
      sid: id, date: past(k), status: (i + k) % 3 === 2 ? 'Absent' : 'Present', remark: ''
    }));

    D().tasks.push({
      id: Store.uid(), sid: id, title: 'Task ' + (i + 1), desc: '',
      assigned: past(10), due: past(i - 2), status: CFG.TASK[i % 3]
    });

    D().activities.push({
      id: Store.uid(), sid: id, title: 'Class participation',
      type: i % 2 ? 'Negative' : 'Positive', points: 5 + i, date: t
    });
  });
}

/* =====================================================
   13. EVENTS (delegation)
   ===================================================== */
document.addEventListener('click', e => {
  const nav = e.target.closest('#nav button');
  if (nav) { view = nav.dataset.v; return render(); }

  const th = e.target.closest('th[data-sort]');
  if (th) {
    ui.dir = ui.sort === th.dataset.sort ? -ui.dir : 1;
    ui.sort = th.dataset.sort;
    return rStuTable();
  }

  const b = e.target.closest('button[data-a]');
  if (!b) return;

  const id = b.dataset.id, d = D();
  const after = () => { Store.save(); render(); };

  const acts = {
    /* students */
    addS: () => studentForm(),
    editS: () => studentForm(find(d.students, id)),
    profile: () => profile(find(d.students, id)),
    delS: () => {
      const s = find(d.students, id), r = Store.related(id);
      if (confirm(`Delete ${s.name} (${s.studentId})?\nThis also deletes ${r.att} attendance, ${r.tasks} task and ${r.acts} activity record(s).`)) {
        Store.removeStudent(id);
        after();
      }
    },
    clear: () => { Object.assign(ui, { q: '', course: '', batch: '', status: '' }); render(); },

    /* attendance */
    allP: () => document.querySelectorAll('tbody input[type=radio][value=Present]').forEach(r => r.checked = true),
    saveAtt,

    /* tasks */
    addT: () => taskForm(),
    editT: () => taskForm(find(d.tasks, id)),
    delT: () => { if (confirm('Delete this task?')) { d.tasks = d.tasks.filter(x => x.id !== id); after(); } },

    /* activities */
    addA: actForm,
    delA: () => { if (confirm('Delete this activity?')) { d.activities = d.activities.filter(x => x.id !== id); after(); } },

    /* analysis & reports */
    cmp: compare,
    repS: repStudent,
    repD: repDate,
    print: () => window.print(),

    /* exports */
    csvS: () => csvDown('students.csv', [
      ['Student ID', 'Name', 'Phone', 'Email', 'Course', 'Batch', 'Status', 'Joined', 'Progress'],
      ...d.students.map(s => [s.studentId, s.name, s.phone, s.email, s.course, s.batch, s.status, s.joined, s.progress])
    ]),
    csvA: () => csvDown('attendance.csv', [
      ['Student ID', 'Name', 'Date', 'Status', 'Remark'],
      ...d.attendance.map(a => { const s = find(d.students, a.sid) || {}; return [s.studentId, s.name, a.date, a.status, a.remark]; })
    ]),
    expJ: () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }));
      a.download = 'mgi-backup.json';
      a.click();
    },

    /* data management */
    sample: () => { loadSample(); after(); },
    wipe: () => {
      if (confirm('Permanently delete ALL data?')) {
        Store.data = { students: [], attendance: [], tasks: [], activities: [] };
        after();
      }
    }
  };

  if (acts[b.dataset.a]) acts[b.dataset.a]();
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; rStuTable(); }
});

document.addEventListener('change', e => {
  const t = e.target;

  if (t.id === 'fc') ui.course = t.value;
  else if (t.id === 'fb') ui.batch = t.value;
  else if (t.id === 'fs') ui.status = t.value;
  else if (t.id === 'ad') {
    if (t.value && t.value <= Calc.today()) ui.attDate = t.value;
    return render();
  }
  else if (t.dataset.a === 'tstat') {
    setTask(find(D().tasks, t.dataset.id), { status: t.value });
    Store.save();
    return render();
  }
  else if (t.id === 'imp' && t.files[0]) {
    t.files[0].text().then(txt => {
      const j = JSON.parse(txt);
      if (!['students', 'attendance', 'tasks', 'activities'].every(k => Array.isArray(j[k]))) throw new Error('Not a valid backup file');
      if (confirm('Replace all current data with this backup?')) { Store.data = j; Store.save(); render(); }
    }).catch(x => alert('Import failed: ' + x.message));
    return;
  }
  else return;

  rStuTable();
});


function render() {
  $('#nav').innerHTML = CFG.VIEWS
    .map(([k, l]) => `<button data-v="${k}" class="${k === view ? 'on' : ''}">${l}</button>`)
    .join('');

  ({
    dashboard: rDash, students: rStu, attendance: rAtt, tasks: rTask,
    activities: rAct, analysis: rAna, reports: rRep, data: rData
  })[view]();
}

Store.load();
render();
</script>
</body>
</html>
